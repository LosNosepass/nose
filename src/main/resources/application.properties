# ─── Datasource (MariaDB / phpMyAdmin local) ───────────────────────────────
# La base de datos debe estar ya creada en phpMyAdmin con el SQL proporcionado
spring.datasource.url=jdbc:mariadb://localhost:3306/movil?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
# validate: Hibernate comprueba que las tablas existen pero NO las modifica
# update:   Hibernate actualiza el esquema si hay cambios (útil en desarrollo)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ────────────────────────────────────────────────────────────────────
